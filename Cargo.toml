[package]
name = "pgmeter"
version = "0.1.0"
edition = "2021"
# Resolver 3 keeps `cargo update` within versions that support `rust-version`.
resolver = "3"
# Minimum supported Rust version. Verified by building and testing with
# `cargo +1.87.0 test --locked`; 1.85 is the floor of clap 4.6's crates and
# 1.87 that of the patched ctutils (RUSTSEC-2026-0385) the postgres driver
# depends on. Keep README.md "Requirements" in sync (tested).
rust-version = "1.87"
authors = ["Julien Tachoires <julien@tachoires.me>"]
description = "PostgreSQL benchmarking tool driven by YAML + Lua workload specs, with bundled TPC-derived reference workloads"
license = "PostgreSQL"
readme = "README.md"
repository = "https://github.com/julmon/pgmeter"
homepage = "https://github.com/julmon/pgmeter"
documentation = "https://julmon.github.io/pgmeter/"
keywords = ["postgresql", "benchmark", "tpc", "oltp", "olap"]
categories = ["command-line-utilities", "database"]
# `samples/` and `src/executor/assets/` are embedded at compile time and must
# ship with the crate; the published docs assets, review notes and any local
# benchmark result directories must not.
exclude = [
    "/docs",
    "/RELEASE_REVIEW.md",
    "/.github",
    "/pgmeter-*",
    "/pgmtr-*",
]

[dependencies]
# Version floors are the versions the test suite and CI run against; the
# lockfile pins the exact ones.
clap = { version = "4.6", features = ["derive", "env", "string"] }
whoami = "2.1"
postgres = "0.19.13"
# The async engine for simple-mode specs: a small Tokio runtime drives every
# client as a task on `tokio-postgres` instead of one thread per client.
tokio-postgres = "0.7.13"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
chrono = "0.4.44"
crossbeam-channel = "0.5.15"
urlencoding = "2.1.3"
rand = { version = "0.9", features = ["small_rng"] }
console = "0.15.11"
indicatif = "0.18"
tabled = "0.22"
ryu = "1.0"
itoa = "1.0"
mlua = { version = "0.10.5", features = ["luau", "vendored", "send"] }
serde = { version = "1", features = ["derive"] }
# serde_yaml is unmaintained (RUSTSEC-2024-0449 via unsafe-libyaml); serde_norway
# is its maintained fork with the same API, used under the serde_yaml name.
serde_yaml = { package = "serde_norway", version = "0.9" }
serde_json = "1"
include_dir = "0.7"
signal-hook = "0.3"
# TLS for the PostgreSQL connections (rustls with the ring provider: no system
# OpenSSL needed at build time).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-postgres-rustls = { version = "0.14", default-features = false, features = ["ring"] }
rustls-native-certs = "0.8"

[dev-dependencies]
# Temporary directories for tests, removed on drop even when a test fails.
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
