[package]
name = "pgmeter"
version = "0.1.0"
edition = "2021"
authors = ["Julien Tachoires <julien@tachoires.me>"]
description = "PostgreSQL benchmarking tool driven by YAML + Lua workload specs, with bundled TPC-derived reference workloads"
license = "PostgreSQL"
readme = "README.md"
repository = "https://github.com/julmon/pgmeter"
homepage = "https://github.com/julmon/pgmeter"
documentation = "https://github.com/julmon/pgmeter/blob/main/docs/yaml-benchmarks.md"
keywords = ["postgresql", "benchmark", "tpc", "oltp", "olap"]
categories = ["command-line-utilities", "database"]
# `samples/` and `src/executor/assets/` are embedded at compile time and must
# ship with the crate; the published docs assets, review notes and any local
# benchmark result directories must not.
exclude = [
    "/docs/images",
    "/docs/sample-report.html",
    "/RELEASE_REVIEW.md",
    "/.github",
    "/pgmeter-*",
    "/pgmtr-*",
]

[dependencies]
clap = { version = "4.0.18", features = ["derive", "env", "string"] }
users = "0.11"
postgres = "0.19.4"
chrono = "0.4.10"
crossbeam-channel = "0.5.6"
urlencoding = "2.1.2"
rand = { version = "0.8.5", features = ["small_rng"] }
console = "0.15.2"
indicatif = "0.17"
itertools = "0.10.5"
tabled = "0.10.0"
ryu = "1.0"
itoa = "1.0"
polars = { version = "0.26.1", features =["lazy", "temporal", "streaming", "fmt", "describe"] }
mlua = { version = "0.10", features = ["luau", "vendored", "send"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
include_dir = "0.7"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
