# TPCx-IoT Benchmark Specification (embedded)
# IoT gateway simulation with sensor data ingestion and queries.
# Self-contained: all transaction and loader Lua is inlined below, so this
# single file needs no external samples/lua/ scripts.

name: TPCx-IoT
description: >
  TPCx-IoT-like benchmark for PostgreSQL. Simulates an electric utility
  operational scenario with power substations containing multiple sensors
  that generate time-series data.

# ---------------------------------------------------------------------------
# Scaling rules
# ---------------------------------------------------------------------------
scaling:
  unit: substation
  max_id_query: "SELECT MAX(ss_id) AS max_id FROM substation"
  constants:
    sensors_per_substation: 100
    initial_measurements_per_sensor: 1000
    measurement_batch_size: 100

# ---------------------------------------------------------------------------
# Metrics
# ---------------------------------------------------------------------------
# TPCx-IoT reports ingestion throughput per second (IoTps). This counts
# committed transactions per second; each transaction may insert a batch of rows.
metrics:
  throughput_unit: "IoTps"
  per: second

# ---------------------------------------------------------------------------
# Schema
# ---------------------------------------------------------------------------
schema:
  pre_ddls:
    - "DROP SEQUENCE IF EXISTS measurement_id_seq CASCADE"
    - "DROP SEQUENCE IF EXISTS alert_id_seq CASCADE"
    - "CREATE SEQUENCE measurement_id_seq"
    - "CREATE SEQUENCE alert_id_seq"

  post_ddls:
    - "SELECT setval('measurement_id_seq', COALESCE((SELECT MAX(m_id) FROM measurement), 1))"
    - "SELECT setval('alert_id_seq', COALESCE((SELECT MAX(a_id) FROM alert), 1))"

  tables:
    - name: substation
      columns:
        - { name: ss_id, type: INTEGER }
        - { name: ss_name, type: "VARCHAR(64)" }
        - { name: ss_location, type: "VARCHAR(128)" }
        - { name: ss_latitude, type: "DOUBLE PRECISION" }
        - { name: ss_longitude, type: "DOUBLE PRECISION" }
        - { name: ss_capacity, type: INTEGER }
        - { name: ss_status, type: "VARCHAR(16)" }
        - { name: ss_created_at, type: TIMESTAMP }
      primary_key: [ss_id]

    - name: sensor
      columns:
        - { name: sn_id, type: BIGINT }
        - { name: sn_ss_id, type: INTEGER }
        - { name: sn_type, type: "VARCHAR(32)" }
        - { name: sn_unit, type: "VARCHAR(16)" }
        - { name: sn_min_threshold, type: "DOUBLE PRECISION" }
        - { name: sn_max_threshold, type: "DOUBLE PRECISION" }
        - { name: sn_status, type: "VARCHAR(16)" }
        - { name: sn_last_reading, type: "DOUBLE PRECISION" }
        - { name: sn_last_reading_at, type: TIMESTAMP }
        - { name: sn_created_at, type: TIMESTAMP }
      primary_key: [sn_id]

    - name: measurement
      columns:
        - { name: m_id, type: BIGINT }
        - { name: m_sn_id, type: BIGINT }
        - { name: m_ss_id, type: INTEGER }
        - { name: m_timestamp, type: TIMESTAMP }
        - { name: m_value, type: "DOUBLE PRECISION" }
        - { name: m_quality, type: INTEGER }
      primary_key: [m_id]

    - name: alert
      columns:
        - { name: a_id, type: BIGINT }
        - { name: a_sn_id, type: BIGINT }
        - { name: a_ss_id, type: INTEGER }
        - { name: a_timestamp, type: TIMESTAMP }
        - { name: a_type, type: "VARCHAR(16)" }
        - { name: a_value, type: "DOUBLE PRECISION" }
        - { name: a_threshold, type: "DOUBLE PRECISION" }
        - { name: a_acknowledged, type: BOOLEAN }
        - { name: a_acknowledged_at, type: TIMESTAMP }
      primary_key: [a_id]

  foreign_keys:
    - { name: fk_sensor_substation,       table: sensor,      columns: [sn_ss_id], references: { table: substation, columns: [ss_id] } }
    - { name: fk_measurement_sensor,      table: measurement, columns: [m_sn_id],  references: { table: sensor,     columns: [sn_id] } }
    - { name: fk_measurement_substation,  table: measurement, columns: [m_ss_id],  references: { table: substation, columns: [ss_id] } }
    - { name: fk_alert_sensor,            table: alert,       columns: [a_sn_id],  references: { table: sensor,     columns: [sn_id] } }
    - { name: fk_alert_substation,        table: alert,       columns: [a_ss_id],  references: { table: substation, columns: [ss_id] } }

  indexes:
    - { name: i_measurement_timestamp,  table: measurement, columns: [m_timestamp] }
    - { name: i_measurement_sensor,     table: measurement, columns: [m_sn_id, m_timestamp] }
    - { name: i_measurement_substation, table: measurement, columns: [m_ss_id, m_timestamp], include: [m_sn_id, m_value] }
    - { name: i_alert_unack,            table: alert,       columns: [a_ss_id, a_acknowledged], where: "NOT a_acknowledged" }
    - { name: i_sensor_substation,      table: sensor,      columns: [sn_ss_id] }

# ---------------------------------------------------------------------------
# Data loading
# ---------------------------------------------------------------------------
load_script: |
  -- TPCx-IoT Per-Substation Data Loading Script
  -- Populates substation, sensor, measurement, alert for each substation ID in `ids`.

  local SENSORS_PER_SS = const.sensors_per_substation       -- 100
  local MEASUREMENTS_PER_SENSOR = const.initial_measurements_per_sensor  -- 1000
  local BATCH_SIZE = 500

  local SENSOR_TYPES = {
      {"VOLTAGE", "V"}, {"CURRENT", "A"}, {"POWER", "kW"}, {"TEMPERATURE", "C"},
      {"FREQUENCY", "Hz"}, {"PRESSURE", "PSI"}, {"HUMIDITY", "%"}, {"VIBRATION", "mm/s"},
  }

  -- Fetch base timestamps once via SQL, then compute offsets in pure Lua
  local now_ts = query_one("SELECT EXTRACT(EPOCH FROM NOW())::bigint")
  local base_24h = now_ts - 86400   -- 24 hours ago
  local base_12h = now_ts - 43200   -- 12 hours ago

  -- Convert epoch seconds to timestamp string (pure Lua, no SQL)
  local function epoch_to_ts(epoch)
      -- PostgreSQL epoch is seconds since 1970-01-01
      -- We use os.date if available, otherwise format via integer math
      local s = epoch % 60
      local m = math.floor(epoch / 60) % 60
      local h = math.floor(epoch / 3600) % 24
      -- For the date part, we need to convert epoch to Y-M-D
      -- Simplified: use a query once to get the base date, then offset
      -- Actually, let's just use string formatting from a pre-computed base
      return nil -- will use batch approach instead
  end

  -- Better approach: pre-compute all timestamps we need as a batch,
  -- or use a simple offset string approach.
  -- Simplest: generate timestamps relative to 'now' using SQL interval arithmetic
  -- in the COPY data itself. PostgreSQL will parse timestamp strings.
  -- We fetch "now" as a string and build timestamps by computing Y/M/D/H/M/S offsets.

  -- Fetch now as components
  local base_row = query("SELECT EXTRACT(YEAR FROM NOW())::int AS y, EXTRACT(MONTH FROM NOW())::int AS mo, "
      .. "EXTRACT(DAY FROM NOW())::int AS d, EXTRACT(HOUR FROM NOW())::int AS h, "
      .. "EXTRACT(MINUTE FROM NOW())::int AS mi, EXTRACT(SECOND FROM NOW())::int AS s")
  local now = base_row[1]

  -- Simple timestamp formatter: base epoch + offset in seconds -> "YYYY-MM-DD HH:MM:SS"
  -- We'll just format the epoch via integer division (UTC)
  local function fmt_ts(epoch)
      -- Days since epoch
      local days = math.floor(epoch / 86400)
      local rem = epoch % 86400
      local hh = math.floor(rem / 3600)
      local mm = math.floor((rem % 3600) / 60)
      local ss = rem % 60

      -- Convert days since 1970-01-01 to Y-M-D using a well-known algorithm
      -- (Howard Hinnant's civil_from_days)
      local z = days + 719468
      local era = math.floor(z / 146097)
      local doe = z - era * 146097
      local yoe = math.floor((doe - math.floor(doe / 1460) + math.floor(doe / 36524) - math.floor(doe / 146096)) / 365)
      local y = yoe + era * 400
      local doy = doe - (365 * yoe + math.floor(yoe / 4) - math.floor(yoe / 100))
      local mp = math.floor((5 * doy + 2) / 153)
      local dd = doy - math.floor((153 * mp + 2) / 5) + 1
      local mo = mp + (mp < 10 and 3 or -9)
      if mo <= 2 then y = y + 1 end

      return string.format("%04d-%02d-%02d %02d:%02d:%02d", y, mo, dd, hh, mm, ss)
  end

  for _, ss_id in ipairs(ids) do
      local sensor_base = (ss_id - 1) * SENSORS_PER_SS

      -- 1. Substation
      copy_start("COPY substation FROM stdin")
      copy_write(string.format("%d\tSubstation-%05d\tLocation-%s\t%.6f\t%.6f\t%d\tACTIVE\t%s\n",
          ss_id, ss_id, rand_string(8, 16),
          rand_float(-90.0, 90.0), rand_float(-180.0, 180.0),
          rand_int(1000, 9999), fmt_ts(now_ts)))
      copy_end()

      -- 2. Sensors (100 per substation)
      copy_start("COPY sensor FROM stdin")
      for offset = 1, SENSORS_PER_SS do
          local sn_id = sensor_base + offset
          local st = SENSOR_TYPES[((offset - 1) % #SENSOR_TYPES) + 1]
          copy_write(string.format("%d\t%d\t%s\t%s\t%.2f\t%.2f\tACTIVE\t%.4f\t%s\t%s\n",
              sn_id, ss_id, st[1], st[2],
              rand_float(10.0, 50.0), rand_float(150.0, 200.0),
              rand_float(50.0, 150.0), fmt_ts(now_ts), fmt_ts(now_ts)))
      end
      copy_end()

      -- 3. Measurements (1000 per sensor = 100,000 per substation)
      local total_measurements = SENSORS_PER_SS * MEASUREMENTS_PER_SENSOR
      local n_batches = math.ceil(total_measurements / BATCH_SIZE)
      local m_id = ((ss_id - 1) * SENSORS_PER_SS * MEASUREMENTS_PER_SENSOR) + 1
      local sensor_offset = 1
      local meas_offset = 0

      for b = 1, n_batches do
          copy_start("COPY measurement FROM stdin")
          local batch_start = (b - 1) * BATCH_SIZE + 1
          local batch_end = math.min(b * BATCH_SIZE, total_measurements)

          for _ = batch_start, batch_end do
              local sn_id = sensor_base + sensor_offset
              local m_ts = fmt_ts(base_24h + meas_offset * 60)

              copy_write(string.format("%d\t%d\t%d\t%s\t%.4f\t%d\n",
                  m_id, sn_id, ss_id, m_ts,
                  rand_float(50.0, 150.0), rand_int(90, 99)))

              m_id = m_id + 1
              meas_offset = meas_offset + 1
              if meas_offset >= MEASUREMENTS_PER_SENSOR then
                  sensor_offset = sensor_offset + 1
                  meas_offset = 0
              end
          end
          copy_end()
      end

      -- 4. Alerts (~10% of sensors = 10 per substation)
      local alerts_per_ss = SENSORS_PER_SS / 10
      local a_id = ((ss_id - 1) * alerts_per_ss) + 1

      copy_start("COPY alert FROM stdin NULL AS ''")
      for i = 0, alerts_per_ss - 1 do
          local sn_id = sensor_base + (i * 10) + 1
          local a_epoch = base_12h + i * 1800  -- 30 minute intervals
          local a_ts = fmt_ts(a_epoch)
          local alert_type, value, threshold
          if rand_int(0, 1) == 1 then
              alert_type = "HIGH"
              value = rand_float(150.0, 200.0)
              threshold = 150.0
          else
              alert_type = "LOW"
              value = rand_float(0.0, 10.0)
              threshold = 10.0
          end
          local acknowledged = rand_int(1, 10) <= 3
          local ack_at = ""
          if acknowledged then
              ack_at = fmt_ts(a_epoch + 3600)  -- +1 hour
          end

          copy_write(string.format("%d\t%d\t%d\t%s\t%s\t%.4f\t%.2f\t%s\t%s\n",
              a_id, sn_id, ss_id, a_ts, alert_type, value, threshold,
              tostring(acknowledged), ack_at))
          a_id = a_id + 1
      end
      copy_end()
  end

# ---------------------------------------------------------------------------
# Transactions (workload)
# ---------------------------------------------------------------------------
transactions:
  - id: 1
    name: Data-Ingestion
    weight: 70
    description: Bulk insert of sensor measurements
    mode: script
    script: |
      -- TPCx-IoT Data Ingestion Transaction
      -- Bulk insert of sensor measurements (100 readings per transaction)

      local substation_id = rand_int(min_id, max_id)
      local sensor_base = (substation_id - 1) * const.sensors_per_substation
      local sensor_id = sensor_base + rand_int(1, const.sensors_per_substation)

      -- Pre-generate measurement data
      local offsets = {}
      local values = {}
      local qualities = {}
      for i = 0, const.measurement_batch_size - 1 do
          offsets[#offsets + 1] = tostring(i * 10)
          values[#values + 1] = string.format("%.4f", rand_float(45.0, 155.0))
          qualities[#qualities + 1] = tostring(rand_int(90, 99))
      end

      local last_reading = values[#values]
      local create_alert = rand_int(1, 100) <= 10
      local alert_value = rand_float(150.0, 200.0)

      begin_tx()

      -- Bulk insert using UNNEST
      exec(
          "INSERT INTO measurement (m_id, m_sn_id, m_ss_id, m_timestamp, m_value, m_quality) "
          .. "SELECT nextval('measurement_id_seq'), "
          .. sensor_id .. ", " .. substation_id
          .. ", NOW() + (ms_offset * interval '1 millisecond'), value, quality "
          .. "FROM UNNEST(ARRAY[" .. table.concat(offsets, ",") .. "]::int[], "
          .. "ARRAY[" .. table.concat(values, ",") .. "]::float8[], "
          .. "ARRAY[" .. table.concat(qualities, ",") .. "]::int[]) AS t(ms_offset, value, quality)"
      )

      -- Update sensor last reading
      exec(
          "UPDATE sensor SET sn_last_reading = $1, sn_last_reading_at = NOW() WHERE sn_id = $2",
          last_reading, sensor_id
      )

      -- Create alert if threshold violation (10% chance)
      if create_alert then
          exec(
              "INSERT INTO alert (a_id, a_sn_id, a_ss_id, a_timestamp, a_type, a_value, a_threshold, a_acknowledged, a_acknowledged_at) "
              .. "VALUES (nextval('alert_id_seq'), $1, $2, NOW(), 'HIGH', $3, 150.0, false, NULL)",
              sensor_id, substation_id, alert_value
          )
      end

      commit()

  - id: 2
    name: Scan-Query
    weight: 10
    description: Time-range aggregation query
    mode: script
    script: |
      -- TPCx-IoT Scan Query Transaction
      -- Time-range aggregation over recent sensor data

      local substation_id = rand_int(min_id, max_id)

      begin_tx()

      query(
          "SELECT m_sn_id, AVG(m_value), MIN(m_value), MAX(m_value), COUNT(*) "
          .. "FROM measurement WHERE m_ss_id = $1 AND m_timestamp >= NOW() - INTERVAL '1 hour' "
          .. "GROUP BY m_sn_id ORDER BY AVG(m_value) DESC LIMIT 10",
          substation_id
      )

      commit()

  - id: 3
    name: Device-Query
    weight: 10
    description: Single sensor data retrieval
    mode: script
    script: |
      -- TPCx-IoT Device Query Transaction
      -- Single sensor data retrieval

      local substation_id = rand_int(min_id, max_id)
      local sensor_base = (substation_id - 1) * const.sensors_per_substation
      local sensor_id = sensor_base + rand_int(1, const.sensors_per_substation)

      begin_tx()

      -- Get sensor details
      query(
          "SELECT sn_id, sn_ss_id, sn_type, sn_unit, sn_min_threshold, sn_max_threshold, sn_status "
          .. "FROM sensor WHERE sn_id = $1",
          sensor_id
      )

      -- Get recent measurements
      query(
          "SELECT m_id, m_timestamp, m_value, m_quality FROM measurement "
          .. "WHERE m_sn_id = $1 ORDER BY m_timestamp DESC LIMIT 100",
          sensor_id
      )

      commit()

  - id: 4
    name: Alert-Query
    weight: 5
    description: Alert status query
    mode: script
    script: |
      -- TPCx-IoT Alert Query Transaction
      -- Retrieves and acknowledges unacknowledged alerts

      local substation_id = rand_int(min_id, max_id)

      begin_tx()

      -- Get unacknowledged alerts
      local rows = query(
          "SELECT a_id, a_sn_id, a_timestamp, a_type, a_value, a_threshold "
          .. "FROM alert WHERE a_ss_id = $1 AND a_acknowledged = false "
          .. "ORDER BY a_timestamp DESC LIMIT 20",
          substation_id
      )

      -- Acknowledge oldest alert if any exist
      if #rows > 0 then
          local alert_id = rows[#rows]["a_id"]
          exec(
              "UPDATE alert SET a_acknowledged = true, a_acknowledged_at = NOW() WHERE a_id = $1",
              alert_id
          )
      end

      commit()

  - id: 5
    name: Threshold-Update
    weight: 5
    description: Sensor threshold configuration update
    mode: script
    script: |
      -- TPCx-IoT Threshold Update Transaction
      -- Updates sensor threshold settings

      local substation_id = rand_int(min_id, max_id)
      local sensor_base = (substation_id - 1) * const.sensors_per_substation
      local sensor_id = sensor_base + rand_int(1, const.sensors_per_substation)

      local min_threshold = rand_float(10.0, 50.0)
      local max_threshold = rand_float(150.0, 200.0)

      begin_tx()

      exec(
          "UPDATE sensor SET sn_min_threshold = $1, sn_max_threshold = $2 WHERE sn_id = $3",
          min_threshold, max_threshold, sensor_id
      )

      commit()
