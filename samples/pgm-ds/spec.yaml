    - { name: fk_call_center_open,      table: call_center,     columns: [cc_open_date_sk],      references: { table: date_dim,              columns: [d_date_sk] } }
    - { name: fk_catalog_page_start,    table: catalog_page,    columns: [cp_start_date_sk],     references: { table: date_dim,              columns: [d_date_sk] } }
    - { name: fk_catalog_page_end,      table: catalog_page,    columns: [cp_end_date_sk],       references: { table: date_dim,              columns: [d_date_sk] } }
    - { name: fk_promotion_start,       table: promotion,       columns: [p_start_date_sk],      references: { table: date_dim,              columns: [d_date_sk] } }
    - { name: fk_promotion_end,         table: promotion,       columns: [p_end_date_sk],        references: { table: date_dim,              columns: [d_date_sk] } }
