    - { name: fk_cr_item,        table: catalog_returns, columns: [cr_item_sk],     references: { table: item,                   columns: [i_item_sk] } }
    - { name: fk_cr_call_center, table: catalog_returns, columns: [cr_call_center_sk], references: { table: call_center,          columns: [cc_call_center_sk] } }
