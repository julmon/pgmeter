    - { name: fk_sr_hdemo,       table: store_returns, columns: [sr_hdemo_sk],   references: { table: household_demographics,  columns: [hd_demo_sk] } }
    - { name: fk_sr_addr,        table: store_returns, columns: [sr_addr_sk],    references: { table: customer_address,        columns: [ca_address_sk] } }
    - { name: fk_sr_store,       table: store_returns, columns: [sr_store_sk],   references: { table: store,                   columns: [s_store_sk] } }
    - { name: fk_sr_reason,      table: store_returns, columns: [sr_reason_sk],  references: { table: reason,                  columns: [r_reason_sk] } }
    - { name: fk_sr_sale,        table: store_returns, columns: [sr_item_sk, sr_ticket_number], references: { table: store_sales, columns: [ss_item_sk, ss_ticket_number] } }

    # ---- catalog_sales / catalog_returns ----
    - { name: fk_cs_sold_date,   table: catalog_sales, columns: [cs_sold_date_sk],  references: { table: date_dim,               columns: [d_date_sk] } }
    - { name: fk_cs_sold_time,   table: catalog_sales, columns: [cs_sold_time_sk],  references: { table: time_dim,               columns: [t_time_sk] } }
