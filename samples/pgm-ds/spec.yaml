  # -------------------------------------------------------------------------
  # Secondary indexes
  # -------------------------------------------------------------------------
  # Driven by the queries' access paths rather than a blanket "index every FK".
  # Leading-column lookups already served by a primary key (ss_item_sk,
  # cs_item_sk, ws_item_sk, sr_item_sk, inv_date_sk) are deliberately omitted.
  indexes:
    # date_dim is the universal filter (d_year [+ d_moy]) for the star joins.
    - { name: idx_date_year,        table: date_dim, columns: [d_year] }
    - { name: idx_date_year_moy,    table: date_dim, columns: [d_year, d_moy] }
    # item filter columns used by Q1..Q6/Q11.
    - { name: idx_item_manufact,    table: item, columns: [i_manufact_id] }
    - { name: idx_item_manager,     table: item, columns: [i_manager_id] }
    - { name: idx_item_category,    table: item, columns: [i_category] }
    # fact -> date / customer / store join columns not covered by a PK.
    - { name: idx_ss_sold_date,     table: store_sales,    columns: [ss_sold_date_sk] }
    - { name: idx_ss_customer,      table: store_sales,    columns: [ss_customer_sk] }
    - { name: idx_ss_store,         table: store_sales,    columns: [ss_store_sk] }
    - { name: idx_cs_sold_date,     table: catalog_sales,  columns: [cs_sold_date_sk] }
    - { name: idx_cs_call_center,   table: catalog_sales,  columns: [cs_call_center_sk] }
    - { name: idx_ws_sold_date,     table: web_sales,      columns: [ws_sold_date_sk] }
    - { name: idx_inv_item,         table: inventory,      columns: [inv_item_sk] }
    - { name: idx_sr_customer,      table: store_returns,  columns: [sr_customer_sk] }
    - { name: idx_sr_returned_date, table: store_returns,  columns: [sr_returned_date_sk] }
    # customer -> address join (Q4/Q5).
    - { name: idx_customer_addr,    table: customer,       columns: [c_current_addr_sk] }

# ---------------------------------------------------------------------------
# Data loading
# ---------------------------------------------------------------------------
# Phase 1: dimension tables only. pre_load_script populates the scale-factor-
# independent dimensions (fixed cross-products and calendars); load_script
# populates the SF-scaling dimensions (customer, customer_address, item, and
# the small "scaling" tables). Fact tables land in a later phase.
pre_load_script: scripts/pgmds_pre_load.lua
load_script: scripts/pgmds_load.lua

# ---------------------------------------------------------------------------
# Query workload
# ---------------------------------------------------------------------------
# The query dispatch table is loaded once per thread as a shared module; it
# defines the global Q[1]..Q[N], and each transaction below runs one Q[n]()
# via an inline script.
scripts:
  modules:
    - scripts/pgmds_queries.lua

# ---------------------------------------------------------------------------
# Transactions (workload)
# ---------------------------------------------------------------------------
# Workload: the TPC-DS queries, numbered as in the specification, one
# transaction each with equal weights. Run with `--once` for the TPC-DS
# stream model (every query once per client); without it the run is a random
# stream. scripts/pgmds_queries.lua holds the SQL and the parameter draws.
# ---------------------------------------------------------------------------
transactions:
  - { id: 1, weight: 1, name: "Q1-Store-Return-Customers", mode: script, script: "Q[1]()", description: "Customers whose store returns exceed 1.2x their store's average" }
  - { id: 2, weight: 1, name: "Q2-Weekly-Web-Catalog", mode: script, script: "Q[2]()", description: "Web and catalog sales per weekday, one year against the next" }
  - { id: 3, weight: 1, name: "Q3-Brand-Manufacturer", mode: script, script: "Q[3]()", description: "Store sales by brand for a manufacturer and month" }
