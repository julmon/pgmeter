    - { name: fk_cs_item,        table: catalog_sales, columns: [cs_item_sk],       references: { table: item,                   columns: [i_item_sk] } }
    - { name: fk_cs_promo,       table: catalog_sales, columns: [cs_promo_sk],      references: { table: promotion,              columns: [p_promo_sk] } }
    - { name: fk_cr_returned_date, table: catalog_returns, columns: [cr_returned_date_sk], references: { table: date_dim,          columns: [d_date_sk] } }
    - { name: fk_cr_item,        table: catalog_returns, columns: [cr_item_sk],     references: { table: item,                   columns: [i_item_sk] } }
    - { name: fk_cr_call_center, table: catalog_returns, columns: [cr_call_center_sk], references: { table: call_center,          columns: [cc_call_center_sk] } }
    - { name: fk_cr_warehouse,   table: catalog_returns, columns: [cr_warehouse_sk], references: { table: warehouse,             columns: [w_warehouse_sk] } }
    - { name: fk_cr_reason,      table: catalog_returns, columns: [cr_reason_sk],   references: { table: reason,                 columns: [r_reason_sk] } }
    - { name: fk_cr_sale,        table: catalog_returns, columns: [cr_item_sk, cr_order_number], references: { table: catalog_sales, columns: [cs_item_sk, cs_order_number] } }

    # ---- web_sales / web_returns ----
    - { name: fk_ws_sold_date,   table: web_sales, columns: [ws_sold_date_sk],  references: { table: date_dim,               columns: [d_date_sk] } }
    - { name: fk_ws_sold_time,   table: web_sales, columns: [ws_sold_time_sk],  references: { table: time_dim,               columns: [t_time_sk] } }
    - { name: fk_ws_ship_date,   table: web_sales, columns: [ws_ship_date_sk],  references: { table: date_dim,               columns: [d_date_sk] } }
    - { name: fk_ws_item,        table: web_sales, columns: [ws_item_sk],       references: { table: item,                   columns: [i_item_sk] } }
    - { name: fk_ws_bill_customer, table: web_sales, columns: [ws_bill_customer_sk], references: { table: customer,            columns: [c_customer_sk] } }
    - { name: fk_ws_ship_customer, table: web_sales, columns: [ws_ship_customer_sk], references: { table: customer,            columns: [c_customer_sk] } }
    - { name: fk_ws_web_page,    table: web_sales, columns: [ws_web_page_sk],   references: { table: web_page,               columns: [wp_web_page_sk] } }
