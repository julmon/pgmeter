  # -------------------------------------------------------------------------
  # Foreign keys
  # -------------------------------------------------------------------------
  # The full snowflake referential graph. The loader generates every surrogate
  # key within its dimension's cardinality (dates are Julian-day keys inside
  # date_dim's calendar; each *_returns line reuses its parent sale's keys), so
  # all of these validate cleanly after load. Use `init --no-fkey` to skip them.
  foreign_keys:
    # ---- dimension -> dimension ----
    - { name: fk_customer_cdemo,        table: customer,        columns: [c_current_cdemo_sk],   references: { table: customer_demographics, columns: [cd_demo_sk] } }
    - { name: fk_customer_hdemo,        table: customer,        columns: [c_current_hdemo_sk],   references: { table: household_demographics, columns: [hd_demo_sk] } }
    - { name: fk_customer_addr,         table: customer,        columns: [c_current_addr_sk],    references: { table: customer_address,      columns: [ca_address_sk] } }
    - { name: fk_customer_shipto_date,  table: customer,        columns: [c_first_shipto_date_sk], references: { table: date_dim,            columns: [d_date_sk] } }
    - { name: fk_customer_sales_date,   table: customer,        columns: [c_first_sales_date_sk], references: { table: date_dim,             columns: [d_date_sk] } }
