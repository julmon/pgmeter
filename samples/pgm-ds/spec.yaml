# PGM-DS Decision Support Benchmark Specification: the 99 TPC-DS queries.
#
# All 24 tables (7 fact + 17 dimension) with columns, primary keys, the full
# snowflake foreign-key graph, and workload-driven secondary indexes; data
# generation (pre_load_script / load_script) for the dimensions and fact tables;
# and the 99 TPC-DS queries (scripts/pgmds_queries.lua + the
# transactions below).
#
# PGM-DS is an open workload DERIVED FROM the TPC-DS specification. It is not an
# audited, spec-compliant TPC benchmark, and its results are NOT comparable to
# official published TPC-DS results. TPC, TPC-B, TPC-C, TPC-H, TPC-DS and TPCx
# are trademarks of the Transaction Processing Performance Council (tpc.org).

name: PGM-DS
description: >
  PGM-DS: a decision-support workload for PostgreSQL, derived from the TPC-DS
  specification (not an audited, spec-compliant TPC benchmark; results are not
  comparable to official TPC-DS results). Snowflake schema with 24 tables
  (7 fact, 17 dimension) and a representative query workload.

# ---------------------------------------------------------------------------
# Scaling rules
# ---------------------------------------------------------------------------
# TPC-DS scaling is non-linear (many dimensions grow sub-linearly with SF), so
# the scale factor is estimated from the store_sales row count (~2.88M rows at
# SF=1, as produced by the load script). GREATEST(1, ...) keeps the id range
# non-empty on a partially loaded dataset.
scaling:
  unit: scalefactor
  max_id_query: "SELECT GREATEST(1, (SELECT COUNT(*) FROM store_sales) / 2880000)::int AS max_id"
  constants:
    store_sales_rows_per_sf: 2880000

# ---------------------------------------------------------------------------
# Metrics
# ---------------------------------------------------------------------------
# Decision-support workload measured in queries per hour. This is a plain
# display label over executed queries -- deliberately NOT the trademarked
# TPC-DS QphDS@SF composite (which folds in load, power, throughput and
# maintenance runs), which only an audited, full-spec run may report.
metrics:
  throughput_unit: "queries/hr"
  per: hour
  # Report where the time went, query by query, rather than a rate.
  report: stream

