  # -------------------------------------------------------------------------
  # The full snowflake referential graph. The loader generates every surrogate
  # key within its dimension's cardinality (dates are Julian-day keys inside
  # date_dim's calendar; each *_returns line reuses its parent sale's keys), so
  # all of these validate cleanly after load. Use `init --no-fkey` to skip them.
  foreign_keys:
