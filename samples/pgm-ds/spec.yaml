    - { name: fk_web_site_open,         table: web_site,        columns: [web_open_date_sk],     references: { table: date_dim,              columns: [d_date_sk] } }
    - { name: fk_web_site_close,        table: web_site,        columns: [web_close_date_sk],    references: { table: date_dim,              columns: [d_date_sk] } }

    # ---- store_sales / store_returns ----
    - { name: fk_ss_sold_date,   table: store_sales, columns: [ss_sold_date_sk], references: { table: date_dim,               columns: [d_date_sk] } }
