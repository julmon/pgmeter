    - { name: fk_wr_item,        table: web_returns, columns: [wr_item_sk],     references: { table: item,                   columns: [i_item_sk] } }
    - { name: fk_wr_web_page,    table: web_returns, columns: [wr_web_page_sk], references: { table: web_page,                columns: [wp_web_page_sk] } }
