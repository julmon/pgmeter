  - { id: 18, weight: 3, name: "Q18-Large-Volume",      mode: script, script: "Q[18]()", description: "Large volume customer" }
  - { id: 19, weight: 3, name: "Q19-Discounted-Rev",    mode: script, script: "Q[19]()", description: "Discounted revenue" }
